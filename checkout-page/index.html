<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    section {
      background: white;
      padding: 20px;
      margin: 20px auto;
      max-width: 500px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    img {
      width: 100%;
      max-width: 200px;
      display: block;
      margin: 10px auto;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }

    button {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    span {
      color: red;
    }

    p {
      font-size: 0.9em;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>Checkout</h1>

  <!-- Cart Section -->
  <section>
    <h2>Your Cart</h2>
    <img 
      src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" 
      alt="A cube-shaped product in the shopping cart"
    />
    <p>Awesome Cube - $19.99</p>
  </section>

  <!-- Payment Section -->
  <section>
    <h2>Payment Information</h2>

    <form>
      <!-- Card Name -->
      <label for="card-name">
        Name on Card 
        <span aria-hidden="true">*</span>
      </label>
      <input 
        type="text" 
        id="card-name" 
        name="card-name" 
        required
      />

      <!-- Card Number -->
      <label for="card-number">
        Card Number 
        <span aria-hidden="true">*</span>
      </label>
      <input 
        type="text" 
        id="card-number" 
        name="card-number" 
        required
        aria-describedby="card-number-help"
      />
      <p id="card-number-help">
        Enter a 16-digit card number with no spaces or dashes.
      </p>

      <button type="submit">Pay Now</button>
    </form>
  </section>

</body>
</html>
