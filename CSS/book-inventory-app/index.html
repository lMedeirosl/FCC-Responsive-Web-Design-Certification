<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Inventory</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Book Inventory</h1>

    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Category</th>
          <th>Status</th>
          <th>Rate</th>
        </tr>
      </thead>
      <tbody>
        <tr class="read">
          <td>Dom Casmurro</td>
          <td>Machado de Assis</td>
          <td>Classic</td>
          <td><span class="status">Read</span></td>
          <td><span class="rate three"><span></span><span></span><span></span></span></td>
        </tr>
        <tr class="read">
          <td>The Hobbit</td>
          <td>J.R.R. Tolkien</td>
          <td>Fantasy</td>
          <td><span class="status">Read</span></td>
          <td><span class="rate two"><span></span><span></span><span></span></span></td>
        </tr>
        <tr class="read">
          <td>Sapiens</td>
          <td>Yuval Noah Harari</td>
          <td>History</td>
          <td><span class="status">Read</span></td>
          <td><span class="rate one"><span></span><span></span><span></span></span></td>
        </tr>
        <tr class="in-progress">
          <td>Clean Code</td>
          <td>Robert C. Martin</td>
          <td>Programming</td>
          <td><span class="status">In Progress</span></td>
          <td><span class="rate"><span></span><span></span><span></span></span></td>
        </tr>
        <tr class="to-read">
          <td>Duna</td>
          <td>Frank Herbert</td>
          <td>Sci-Fi</td>
          <td><span class="status">To Read</span></td>
          <td><span class="rate"><span></span><span></span><span></span></span></td>
        </tr>
        <tr class="to-read">
          <td>1984</td>
          <td>George Orwell</td>
          <td>Dystopia</td>
          <td><span class="status">To Read</span></td>
          <td><span class="rate"><span></span><span></span><span></span></span></td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
