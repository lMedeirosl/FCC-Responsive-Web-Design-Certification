<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stylized To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <ul class="todo-list">
    
    <li>
      <input type="checkbox" id="task1">
      <label for="task1">Study HTML</label>
      <ul class="sub-item">
        <li>
          <a href="https://developer.mozilla.org" target="_blank" class="sub-item-link">
            MDN Docs
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="task2">
      <label for="task2">Practice CSS</label>
      <ul class="sub-item">
        <li>
          <a href="https://css-tricks.com" target="_blank" class="sub-item-link">
            CSS Tricks
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="task3">
      <label for="task3">Learn JavaScript</label>
      <ul class="sub-item">
        <li>
          <a href="https://javascript.info" target="_blank" class="sub-item-link">
            JavaScript Info
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="task4">
      <label for="task4">Build Projects</label>
      <ul class="sub-item">
        <li>
          <a href="https://freecodecamp.org" target="_blank" class="sub-item-link">
            freeCodeCamp
          </a>
        </li>
      </ul>
    </li>

  </ul>

</body>
</html>
